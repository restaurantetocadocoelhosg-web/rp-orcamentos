<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RP Orçamentos - Casa RP Resistências</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5C4033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RP Orçamentos">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #FDF6E3; --card: #FFFFFF; --primary: #5C4033; --secondary: #8B7355;
      --success: #2E8B57; --danger: #C0392B; --text: #2C3E50; --border: #D2B48C;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    .splash { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.5s; }
    .splash-logo { text-align: center; }
    .splash-logo img { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .splash-logo h1 { font-size: 1.4rem; color: var(--primary); }
    .splash-logo p { color: var(--secondary); margin-top: 8px; font-size: 0.9rem; }
    .app { padding: 16px; max-width: 600px; margin: 0 auto; }
    .hidden { display: none !important; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h2 { font-size: 1.3rem; color: var(--primary); }
    .header span { font-size: 0.8rem; color: var(--secondary); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: var(--card); padding: 6px; border-radius: 12px; box-shadow: var(--shadow); }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 500; color: var(--secondary); border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab.active { background: var(--primary); color: #FFF; }
    .panel { display: none; }
    .panel.active { display: block; }
    .btn-primary, .btn-secondary, .btn-success, .btn-danger { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: var(--primary); color: #FFF; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-success { background: var(--success); color: #FFF; }
    .btn-danger { background: var(--danger); color: #FFF; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); padding: 14px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
    .card h4 { font-size: 1rem; margin-bottom: 4px; }
    .card p { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .card .status { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; background: #EEE; }
    .status.aprovado { background: #D4EDDA; color: #155724; }
    .status.fabricacao { background: #FFF3CD; color: #856404; }
    .status.pronto { background: #D1ECF1; color: #0C5460; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 16px; color: var(--primary); }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .item-row input:first-child { flex: 2; }
    .item-row input { flex: 1; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #25D366; color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(37,211,102,0.4); text-decoration: none; z-index: 90; }
    #client-search { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="icons/icon-192.png" alt="Logo RP">
      <h1>Casa RP Resistências</h1>
      <p>Carregando sistema...</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="header">
      <h2>📋 Orçamentos & Pedidos</h2>
      <span id="company-tag">Casa RP Resistências</span>
    </header>
    <nav class="tabs">
      <button class="tab active" data-target="orcamentos">Orçamentos</button>
      <button class="tab" data-target="pedidos">Pedidos</button>
      <button class="tab" data-target="clientes">Clientes</button>
    </nav>
    <main class="content">
      <section id="orcamentos" class="panel active">
        <button class="btn-primary" onclick="openQuoteModal()">+ Novo Orçamento</button>
        <div id="quotes-list" class="list"></div>
      </section>
      <section id="pedidos" class="panel">
        <div id="orders-list" class="list"></div>
      </section>
      <section id="clientes" class="panel">
        <input type="text" id="client-search" placeholder="🔍 Buscar cliente..." oninput="renderClients()">
        <div id="clients-list" class="list"></div>
      </section>
    </main>
    <a id="fab-whatsapp" class="fab" href="#" target="_blank">💬</a>
  </div>

  <div id="quote-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Novo Orçamento</h3>
      <form id="quote-form">
        <input type="text" id="q-client-name" placeholder="Nome do Cliente" required>
        <input type="tel" id="q-client-phone" placeholder="WhatsApp (ex: 21999999999)" required>
        <input type="file" id="q-photo" accept="image/*">
        <div id="q-items">
          <div class="item-row">
            <input type="text" class="i-desc" placeholder="Produto/Modelo" required>
            <input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required>
            <input type="number" class="i-price" placeholder="R$ Un" step="0.01" required>
          </div>
        </div>
        <button type="button" class="btn-secondary" onclick="addItemRow()">+ Item</button>
        <div class="modal-actions">
          <button type="button" class="btn-danger" onclick="closeQuoteModal()">Cancelar</button>
          <button type="submit" class="btn-success">✅ Gerar PDF & Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const COMPANY = {
      name: "CASA RP RESISTÊNCIAS", razao: "RUBENS R C P DA SILVA RESISTENCIAS",
      cnpj: "40.037.362/0001-71", ie: "11917356",
      address: "R. VISCONDE DO URUGUAI 264 CENTRO - NITERÓI/RJ - CEP: 24030-073",
      phone: "(21) 2620-8167", whatsapp: "5521965987979",
      email: "casarpresistenciaseletrica@hotmail.com", ncm: "85168010", minNF: 1000.00
    };

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("splash").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("splash").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
        }, 500);
      }, 2000);
      initTabs(); renderQuotes(); renderOrders(); renderClients(); updateFab();
    });

    function initTabs() {
      document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(btn.dataset.target).classList.add("active");
        });
      });
    }

    function getNextQuoteNumber() {
      let counter = parseInt(localStorage.getItem("rp_quote_counter") || "0");
      counter++; localStorage.setItem("rp_quote_counter", counter);
      return `ORC-${new Date().getFullYear()}-${String(counter).padStart(4, "0")}`;
    }

    function openQuoteModal() { document.getElementById("quote-modal").classList.remove("hidden"); }
    function closeQuoteModal() {
      document.getElementById("quote-modal").classList.add("hidden");
      document.getElementById("quote-form").reset();
      document.getElementById("q-items").innerHTML = `<div class="item-row"><input type="text" class="i-desc" placeholder="Produto/Modelo" required><input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required><input type="number" class="i-price" placeholder="R$ Un" step="0.01" required></div>`;
    }
    function addItemRow() {
      const row = document.createElement("div"); row.className = "item-row";
      row.innerHTML = `<input type="text" class="i-desc" placeholder="Produto/Modelo" required><input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required><input type="number" class="i-price" placeholder="R$ Un" step="0.01" required>`;
      document.getElementById("q-items").appendChild(row);
    }

    document.getElementById("quote-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const number = getNextQuoteNumber();
      const clientName = document.getElementById("q-client-name").value.trim();
      const clientPhone = document.getElementById("q-client-phone").value.replace(/\D/g, "");
      const photoInput = document.getElementById("q-photo");
      let photoBase64 = null;
      if (photoInput.files[0]) photoBase64 = await readFileAsBase64(photoInput.files[0]);

      const items = [];
      document.querySelectorAll(".item-row").forEach(row => {
        const desc = row.querySelector(".i-desc").value.trim();
        const qty = parseInt(row.querySelector(".i-qty").value) || 0;
        const price = parseFloat(row.querySelector(".i-price").value) || 0;
        if (desc && qty > 0 && price > 0) items.push({ desc, qty, price, total: qty * price });
      });

      const total = items.reduce((acc, i) => acc + i.total, 0);
      const quote = { id: crypto.randomUUID(), number, client: { name: clientName, phone: clientPhone }, items, total, photo: photoBase64, status: "EM_ANALISE", date: new Date().toISOString(), validUntil: new Date(Date.now() + 15 * 86400000).toISOString() };
      saveQuote(quote); saveClient(quote.client); generatePDF(quote); closeQuoteModal(); renderQuotes();
      alert(`✅ Orçamento ${number} gerado com sucesso!`);
    });

    function readFileAsBase64(file) { return new Promise(r => { const f = new FileReader(); f.onloadend = () => r(f.result); f.readAsDataURL(file); }); }
    function saveQuote(q) { const qs = JSON.parse(localStorage.getItem("rp_quotes") || "[]"); qs.unshift(q); localStorage.setItem("rp_quotes", JSON.stringify(qs)); }
    function saveClient(c) { const cs = JSON.parse(localStorage.getItem("rp_clients") || "[]"); if (!cs.find(x => x.phone === c.phone)) { cs.push({ ...c, id: crypto.randomUUID(), createdAt: new Date().toISOString() }); localStorage.setItem("rp_clients", JSON.stringify(cs)); } }

    function renderQuotes() {
      const list = document.getElementById("quotes-list");
      const quotes = JSON.parse(localStorage.getItem("rp_quotes") || "[]");
      list.innerHTML = quotes.map(q => `
        <div class="card"><h4>${q.number} - ${q.client.name}</h4><p>📅 ${new Date(q.date).toLocaleDateString('pt-BR')} | 💰 R$ ${q.total.toFixed(2)}</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="approveQuote('${q.id}')">✅ Aprovar</button>
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="sendWhatsAppQuote('${q.id}')">💬 Enviar</button>
        </div></div>`).join("");
    }

    function renderOrders() {
      const list = document.getElementById("orders-list");
      const orders = JSON.parse(localStorage.getItem("rp_orders") || "[]");
      list.innerHTML = orders.map(o => `
        <div class="card"><h4>${o.number} - ${o.client.name}</h4><p>📦 Status: <span class="status ${o.status.toLowerCase()}">${o.status.replace("_", " ")}</span></p>
        <p>💰 Sinal: R$ ${(o.total * 0.3).toFixed(2)} | Total: R$ ${o.total.toFixed(2)}</p>
        <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','EM_FABRICACAO')">🔧 Fabricação</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','EM_ESTOQUE')">📦 Estoque</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','PRONTO_RETIRADA')">✅ Pronto</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="sendWhatsAppOrder('${o.id}')">💬 Cobrar</button>
        </div></div>`).join("");
    }

    function renderClients() {
      const list = document.getElementById("clients-list");
      const search = document.getElementById("client-search").value.toLowerCase();
      const clients = JSON.parse(localStorage.getItem("rp_clients") || "[]");
      list.innerHTML = clients.filter(c => c.name.toLowerCase().includes(search) || c.phone.includes(search))
        .map(c => `<div class="card"><h4>${c.name}</h4><p>📱 ${c.phone}</p><button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem; margin-top:4px;" onclick="window.open('https://wa.me/${c.phone}','_blank')">💬 WhatsApp</button></div>`).join("");
    }

    function approveQuote(id) {
      const quotes = JSON.parse(localStorage.getItem("rp_quotes") || "[]");
      const q = quotes.find(x => x.id === id); if (!q) return;
      q.status = "APROVADO"; localStorage.setItem("rp_quotes", JSON.stringify(quotes));
      const orders = JSON.parse(localStorage.getItem("rp_orders") || "[]");
      const orderNum = `PED-${new Date().getFullYear()}-${String(orders.length + 1).padStart(4, "0")}`;
      orders.push({ id: crypto.randomUUID(), number: orderNum, quoteId: q.id, client: q.client, items: q.items, total: q.total, status: "EM_FABRICACAO", createdAt: new Date().toISOString() });
      localStorage.setItem("rp_orders", JSON.stringify(orders)); renderQuotes(); renderOrders();
      alert(`✅ Orçamento aprovado! Pedido ${orderNum} criado.`);
    }

    function updateOrderStatus(id, status) {
      const orders = JSON.parse(localStorage.getItem("rp_orders") || "[]");
      const o = orders.find(x => x.id === id); if (o) { o.status = status; localStorage.setItem("rp_orders", JSON.stringify(orders)); renderOrders(); }
    }

    function updateFab() { document.getElementById("fab-whatsapp").href = `https://wa.me/${COMPANY.whatsapp}`; }
    function sendWhatsAppQuote(id) {
      const q = JSON.parse(localStorage.getItem("rp_quotes") || "[]").find(x => x.id === id); if (!q) return;
      window.open(`https://wa.me/${q.client.phone}?text=${encodeURIComponent(`Olá ${q.client.name}! Segue o orçamento ${q.number} no valor de R$ ${q.total.toFixed(2)}. Válido por 15 dias. 📄✨`)}`, "_blank");
    }
    function sendWhatsAppOrder(id) {
      const o = JSON.parse(localStorage.getItem("rp_orders") || "[]").find(x => x.id === id); if (!o) return;
      window.open(`https://wa.me/${o.client.phone}?text=${encodeURIComponent(`Olá ${o.client.name}! Seu pedido ${o.number} está: ${o.status.replace("_"," ")}. ${o.status==="PRONTO_RETIRADA"?"Já pode retirar!":"Avisaremos quando pronto."} 💡`)}`, "_blank");
    }

    function generatePDF(q) {
      const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: "mm", format: "a4" });
      doc.setFontSize(11).setFont("helvetica", "bold").text(COMPANY.name, 105, 15, { align: "center" });
      doc.setFontSize(8).setFont("helvetica", "normal");
      doc.text(`CNPJ: ${COMPANY.cnpj} | IE: ${COMPANY.ie}`, 105, 20, { align: "center" });
      doc.text(`END: ${COMPANY.address}`, 105, 24, { align: "center" });
      doc.text(`TEL: ${COMPANY.phone} | WHATS: ${COMPANY.whatsapp}`, 105, 28, { align: "center" });
      doc.setFontSize(10).setFont("helvetica", "bold").text(`ORÇAMENTO ${q.number}`, 190, 15, { align: "right" });
      doc.setFontSize(8).text(`DATA: ${new Date().toLocaleDateString('pt-BR')} | PROPOSTA VÁLIDA POR 15 DIAS`, 190, 20, { align: "right" });
      doc.setFontSize(9).setFont("helvetica", "bold").text("CLIENTE:", 15, 38);
      doc.setFont("helvetica", "normal").text(`${q.client.name} | ${q.client.phone}`, 15, 43);
      let y = 52; doc.setFontSize(8).setFont("helvetica", "bold");
      doc.text("Qtd.", 15, y); doc.text("Produto", 30, y); doc.text("R$un", 140, y, { align: "right" }); doc.text("Total", 170, y, { align: "right" });
      doc.setLineWidth(0.2).line(15, y + 2, 195, y + 2); y += 6;
      doc.setFont("helvetica", "normal");
      q.items.forEach(i => { doc.text(String(i.qty), 15, y); doc.text(i.desc, 30, y, { maxWidth: 105 }); doc.text(`R$${i.price.toFixed(2)}`, 140, y, { align: "right" }); doc.text(`R$${i.total.toFixed(2)}`, 170, y, { align: "right" }); y += 6; });
      doc.line(15, y + 2, 195, y + 2); doc.setFont("helvetica", "bold").text(`TOTAL: R$${q.total.toFixed(2)}`, 170, y + 8, { align: "right" }); y += 16;
      doc.setFontSize(7).setFont("helvetica", "normal");
      ["EM CASO DE FABRICAÇÃO","PRAZO DE FABRICAÇÃO: 12 A 20 DIAS ÚTEIS","PODENDO TER ALTERAÇÃO NO PREÇO CONFORME AMOSTRA FÍSICA OU DESENHO DETALHADO","SINAL DE FABRICAÇÃO: 30% DO VALOR TOTAL",`CÓDIGO NCM: ${COMPANY.ncm}`,"ALÍQUOTA DE IPI: SEM INFORMAÇÃO | ALÍQUOTA DE ICMS: OPERAÇÃO 500","CONDIÇÃO DE ENTREGA: (FRETE) RETIRADA NA LOJA","O PRODUTO É 100% NOVO? SIM, FABRICADO",`FATURAMENTO MÍNIMO PARA EMISSÃO DE NF: R$ ${COMPANY.minNF.toFixed(2)}`,`FABRICANTE: ${COMPANY.name}`,"CONFORME SOLICITAÇÃO, MATERIAL TERÁ QUE SER FABRICADO COM PRAZO MÍNIMO DE 12 Á 20 DIAS ÚTEIS"].forEach(t => { doc.text(t, 15, y); y += 4; });
      if (q.photo) try { doc.addImage(q.photo, "JPEG", 15, y + 5, 40, 30); } catch(e) {}
      doc.save(`${q.number}.pdf`);
    }

    // PWA: service worker para funcionar offline e instalar na tela inicial
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
