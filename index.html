<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RP Orçamentos - Casa RP Resistências</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5C4033">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RP Orçamentos">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #FDF6E3; --card: #FFFFFF; --primary: #5C4033; --secondary: #8B7355;
      --success: #2E8B57; --danger: #C0392B; --text: #2C3E50; --border: #D2B48C;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    .splash { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; transition: opacity 0.5s; }
    .splash-logo { text-align: center; }
    .splash-logo img { width: 100px; height: 100px; border-radius: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
    .splash-logo h1 { font-size: 1.4rem; color: var(--primary); }
    .splash-logo p { color: var(--secondary); margin-top: 8px; font-size: 0.9rem; }
    .app { padding: 16px; max-width: 600px; margin: 0 auto; }
    .hidden { display: none !important; }
    .header { text-align: center; margin-bottom: 16px; }
    .header h2 { font-size: 1.3rem; color: var(--primary); }
    .header span { font-size: 0.8rem; color: var(--secondary); }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; background: var(--card); padding: 6px; border-radius: 12px; box-shadow: var(--shadow); }
    .tab { flex: 1; padding: 10px; border: none; background: transparent; font-weight: 500; color: var(--secondary); border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .tab.active { background: var(--primary); color: #FFF; }
    .panel { display: none; }
    .panel.active { display: block; }
    .btn-primary, .btn-secondary, .btn-success, .btn-danger { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: var(--primary); color: #FFF; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-success { background: var(--success); color: #FFF; }
    .btn-danger { background: var(--danger); color: #FFF; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); padding: 14px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid var(--primary); }
    .card h4 { font-size: 1rem; margin-bottom: 4px; }
    .card p { font-size: 0.85rem; color: #666; margin-bottom: 6px; }
    .card .status { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; background: #EEE; }
    .status.aprovado { background: #D4EDDA; color: #155724; }
    .status.fabricacao { background: #FFF3CD; color: #856404; }
    .status.pronto { background: #D1ECF1; color: #0C5460; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 16px; width: 90%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 16px; color: var(--primary); }
    .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .item-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .item-row input:first-child { flex: 2; }
    .item-row input { flex: 1; }
    .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
    .fab { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; background: #25D366; color: #FFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(37,211,102,0.4); text-decoration: none; z-index: 90; }
    #client-search { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="icons/icon-192.png" alt="Logo RP">
      <h1>Casa RP Resistências</h1>
      <p>Carregando sistema...</p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="header">
      <h2>📋 Orçamentos & Pedidos</h2>
      <span id="company-tag">Casa RP Resistências</span>
    </header>
    <nav class="tabs">
      <button class="tab active" data-target="orcamentos">Orçamentos</button>
      <button class="tab" data-target="pedidos">Pedidos</button>
      <button class="tab" data-target="clientes">Clientes</button>
      <button class="tab" data-target="cobrancas">Cobranças</button>
    </nav>
    <main class="content">
      <section id="orcamentos" class="panel active">
        <button class="btn-primary" onclick="openQuoteModal()">+ Novo Orçamento</button>
        <input type="text" id="quote-search" placeholder="🔍 Buscar por cliente, telefone ou nº..." oninput="renderQuotes()" style="margin-top:10px;">
        <div id="quotes-list" class="list"></div>
      </section>
      <section id="pedidos" class="panel">
        <input type="text" id="order-search" placeholder="🔍 Buscar por cliente, telefone ou nº..." oninput="renderOrders()">
        <div id="orders-list" class="list"></div>
      </section>
      <section id="clientes" class="panel">
        <input type="text" id="client-search" placeholder="🔍 Buscar cliente..." oninput="renderClients()">
        <div id="clients-list" class="list"></div>
      </section>
      <section id="cobrancas" class="panel">
        <div style="font-size:0.8rem; color:var(--secondary); margin-bottom:10px;">Orçamentos ainda não aprovados — cobre pelo WhatsApp. ⏰ a partir de 7 dias · ⚠️ vencidos (15 dias).</div>
        <div id="cobr-list" class="list"></div>
      </section>
    </main>
    <a id="fab-whatsapp" class="fab" href="#" target="_blank">💬</a>
  </div>

  <div id="quote-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Novo Orçamento</h3>
      <form id="quote-form">
        <div style="background:#FFF8E7; border:1px dashed var(--border); border-radius:10px; padding:10px; margin-bottom:12px;">
          <div style="font-size:0.82rem; font-weight:600; color:var(--primary); margin-bottom:6px;">🤖 Preencher com IA</div>
          <textarea id="ia-input" rows="3" placeholder="Descreva o pedido. Ex: Cliente Jurandir 21 96598-7979 — 5 resistências de imersão tubo cobre 8mm formato U 400mm 2000W 220V; 2 termostatos bulbo 20-120°C" style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; margin-bottom:8px;"></textarea>
          <button type="button" class="btn-secondary" style="margin-bottom:0;" onclick="preencherIA(this)">✨ Gerar itens com IA</button>
        </div>
        <input type="text" id="q-client-name" placeholder="Nome do Cliente" required>
        <input type="tel" id="q-client-phone" placeholder="WhatsApp (ex: 21999999999)" required>
        <input type="file" id="q-photo" accept="image/*">
        <div id="q-items">
          <div class="item-row">
            <input type="text" class="i-desc" placeholder="Produto/Modelo" required>
            <input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required>
            <input type="number" class="i-price" placeholder="R$ Un" step="0.01" required>
          </div>
        </div>
        <button type="button" class="btn-secondary" onclick="addItemRow()">+ Item</button>
        <div class="modal-actions">
          <button type="button" class="btn-danger" onclick="closeQuoteModal()">Cancelar</button>
          <button type="submit" class="btn-success">✅ Gerar PDF & Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const COMPANY = {
      name: "CASA RP RESISTÊNCIAS", razao: "RUBENS R C P DA SILVA RESISTENCIAS",
      cnpj: "40.037.362/0001-71", ie: "11917356",
      address: "R. VISCONDE DO URUGUAI 264 CENTRO - NITERÓI/RJ - CEP: 24030-073",
      phone: "(21) 2620-8167", whatsapp: "5521965987979",
      email: "casarpresistenciaseletrica@hotmail.com", ncm: "85168010", minNF: 1000.00
    };

    // ===== Backend Supabase (sincroniza entre aparelhos) + cache offline =====
    const SUPA_URL = "https://zuwdgyvbuaocbzckhhlm.supabase.co";
    const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1d2RneXZidWFvY2J6Y2toaGxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODk0MTUsImV4cCI6MjA5MjI2NTQxNX0._v0lytkvd854urjD0l45rX9vrzSUh0Ro2VuGINsLwmM";
    const SB_H = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };
    let STATE = { quotes: [], orders: [], clients: [] };
    let editingQuoteId = null;
    async function sbSelect(table, q) { try { const r = await fetch(`${SUPA_URL}/rest/v1/${table}?${q || ""}`, { headers: SB_H }); return r.ok ? await r.json() : []; } catch (e) { return null; } }
    async function sbInsert(table, obj) { try { await fetch(`${SUPA_URL}/rest/v1/${table}`, { method: "POST", headers: { ...SB_H, "Prefer": "return=minimal" }, body: JSON.stringify(obj) }); } catch (e) {} }
    async function sbPatch(table, col, val, obj) { try { await fetch(`${SUPA_URL}/rest/v1/${table}?${col}=eq.${val}`, { method: "PATCH", headers: { ...SB_H, "Prefer": "return=minimal" }, body: JSON.stringify(obj) }); } catch (e) {} }
    async function sbUpsert(table, obj, onConflict) { try { await fetch(`${SUPA_URL}/rest/v1/${table}?on_conflict=${onConflict}`, { method: "POST", headers: { ...SB_H, "Prefer": "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(obj) }); } catch (e) {} }
    async function sbDelete(table, col, val) { try { await fetch(`${SUPA_URL}/rest/v1/${table}?${col}=eq.${val}`, { method: "DELETE", headers: { ...SB_H, "Prefer": "return=minimal" } }); } catch (e) {} }
    // Busca inteligente: nome, telefone, número e mercadoria (descrição dos itens).
    function matchSearch(rec, term) {
      if (!term) return true;
      const itens = (rec.items || []).map(i => i.desc || "").join(" ");
      const hay = `${(rec.client && rec.client.name) || ""} ${(rec.client && rec.client.phone) || ""} ${rec.number || ""} ${itens}`.toLowerCase();
      return term.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
    }
    function cacheSave() { try { localStorage.setItem("rp_cache", JSON.stringify(STATE)); } catch (e) {} }
    function cacheLoad() { try { const c = JSON.parse(localStorage.getItem("rp_cache") || "null"); if (c) STATE = c; } catch (e) {} }
    async function loadAll() {
      const [q, o, c] = await Promise.all([
        sbSelect("rp_quotes", "select=*&order=created_at.desc"),
        sbSelect("rp_orders", "select=*&order=created_at.desc"),
        sbSelect("rp_clients", "select=*&order=created_at.desc")
      ]);
      if (q === null || o === null || c === null) { cacheLoad(); }
      else { STATE.quotes = q.map(r => ({ ...r.data, id: r.id })); STATE.orders = o.map(r => ({ ...r.data, id: r.id })); STATE.clients = c; cacheSave(); }
      renderQuotes(); renderOrders(); renderClients(); renderCobrancas();
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        document.getElementById("splash").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("splash").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
        }, 500);
      }, 2000);
      initTabs(); cacheLoad(); renderQuotes(); renderOrders(); renderClients(); renderCobrancas(); updateFab(); loadAll();
    });

    function initTabs() {
      document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById(btn.dataset.target).classList.add("active");
        });
      });
    }

    function getNextQuoteNumber() {
      const year = new Date().getFullYear();
      const n = STATE.quotes.filter(q => (q.number || "").startsWith(`ORC-${year}`)).length + 1;
      return `ORC-${year}-${String(n).padStart(4, "0")}`;
    }

    function setQuoteModalMode(editing, q) {
      document.querySelector("#quote-modal h3").textContent = editing ? `✏️ Editar ${q.number}` : "Novo Orçamento";
      document.querySelector('#quote-form button[type="submit"]').textContent = editing ? "💾 Salvar alterações" : "✅ Gerar PDF & Salvar";
    }
    function openQuoteModal() {
      editingQuoteId = null;
      document.getElementById("quote-form").reset();
      document.getElementById("q-items").innerHTML = `<div class="item-row"><input type="text" class="i-desc" placeholder="Produto/Modelo" required><input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required><input type="number" class="i-price" placeholder="R$ Un" step="0.01" required></div>`;
      setQuoteModalMode(false);
      document.getElementById("quote-modal").classList.remove("hidden");
    }
    function closeQuoteModal() {
      document.getElementById("quote-modal").classList.add("hidden");
      document.getElementById("quote-form").reset();
      document.getElementById("q-items").innerHTML = `<div class="item-row"><input type="text" class="i-desc" placeholder="Produto/Modelo" required><input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required><input type="number" class="i-price" placeholder="R$ Un" step="0.01" required></div>`;
      editingQuoteId = null;
      setQuoteModalMode(false);
    }
    function editQuote(id) {
      const q = STATE.quotes.find(x => x.id === id); if (!q) return;
      editingQuoteId = id;
      document.getElementById("q-client-name").value = q.client.name || "";
      document.getElementById("q-client-phone").value = q.client.phone || "";
      const cont = document.getElementById("q-items"); cont.innerHTML = "";
      (q.items && q.items.length ? q.items : [{ desc: "", qty: 1, price: "" }]).forEach(it => {
        const row = document.createElement("div"); row.className = "item-row";
        row.innerHTML = `<input type="text" class="i-desc" value="${String(it.desc || "").replace(/"/g, "&quot;")}" placeholder="Produto/Modelo" required><input type="number" class="i-qty" min="1" value="${it.qty || 1}" required><input type="number" class="i-price" step="0.01" value="${it.price || ""}" placeholder="R$ Un" required>`;
        cont.appendChild(row);
      });
      setQuoteModalMode(true, q);
      document.getElementById("quote-modal").classList.remove("hidden");
    }
    async function cancelarOrcamento(id) {
      const q = STATE.quotes.find(x => x.id === id); if (!q) return;
      if (!confirm(`Cancelar/excluir o orçamento ${q.number} de ${q.client.name || "cliente"}? Não dá pra desfazer.`)) return;
      STATE.quotes = STATE.quotes.filter(x => x.id !== id);
      await sbDelete("rp_quotes", "id", id); cacheSave();
      renderQuotes(); renderCobrancas();
    }
    function addItemRow() {
      const row = document.createElement("div"); row.className = "item-row";
      row.innerHTML = `<input type="text" class="i-desc" placeholder="Produto/Modelo" required><input type="number" class="i-qty" placeholder="Qtd" min="1" value="1" required><input type="number" class="i-price" placeholder="R$ Un" step="0.01" required>`;
      document.getElementById("q-items").appendChild(row);
    }

    document.getElementById("quote-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const clientName = document.getElementById("q-client-name").value.trim();
      const clientPhone = document.getElementById("q-client-phone").value.replace(/\D/g, "");
      const items = [];
      document.querySelectorAll(".item-row").forEach(row => {
        const desc = row.querySelector(".i-desc").value.trim();
        const qty = parseInt(row.querySelector(".i-qty").value) || 0;
        const price = parseFloat(row.querySelector(".i-price").value) || 0;
        if (desc && qty > 0 && price > 0) items.push({ desc, qty, price, total: qty * price });
      });
      if (!items.length) { alert("Adicione ao menos um item com quantidade e preço."); return; }
      const total = items.reduce((acc, i) => acc + i.total, 0);

      // ----- EDIÇÃO de orçamento existente -----
      if (editingQuoteId) {
        const q = STATE.quotes.find(x => x.id === editingQuoteId);
        if (q) {
          q.client = { name: clientName, phone: clientPhone }; q.items = items; q.total = total;
          await sbPatch("rp_quotes", "id", q.id, { data: q }); await saveClient(q.client); cacheSave();
          generatePDF(q); closeQuoteModal(); renderQuotes(); renderCobrancas();
          alert(`✅ Orçamento ${q.number} atualizado!`);
        }
        return;
      }

      // ----- NOVO orçamento -----
      const photoInput = document.getElementById("q-photo");
      let photoBase64 = null;
      if (photoInput.files[0]) photoBase64 = await readFileAsBase64(photoInput.files[0]);
      const number = getNextQuoteNumber();
      const quote = { id: crypto.randomUUID(), number, client: { name: clientName, phone: clientPhone }, items, total, photo: photoBase64, status: "EM_ANALISE", date: new Date().toISOString(), validUntil: new Date(Date.now() + 15 * 86400000).toISOString() };
      STATE.quotes.unshift(quote);
      await saveQuote(quote); await saveClient(quote.client); cacheSave();
      generatePDF(quote); closeQuoteModal(); renderQuotes(); renderCobrancas();
      alert(`✅ Orçamento ${number} gerado com sucesso!`);
    });

    function readFileAsBase64(file) { return new Promise(r => { const f = new FileReader(); f.onloadend = () => r(f.result); f.readAsDataURL(file); }); }
    async function saveQuote(q) { await sbInsert("rp_quotes", { id: q.id, number: q.number, data: q }); }
    async function saveClient(c) { if (!STATE.clients.find(x => x.phone === c.phone)) { const row = { id: crypto.randomUUID(), name: c.name, phone: c.phone }; STATE.clients.unshift(row); await sbUpsert("rp_clients", row, "phone"); } }

    function renderQuotes() {
      const list = document.getElementById("quotes-list");
      const se = document.getElementById("quote-search"); const term = se ? se.value.trim() : "";
      const quotes = STATE.quotes.filter(q => matchSearch(q, term));
      list.innerHTML = quotes.length ? quotes.map(q => `
        <div class="card"><h4>${q.client.name || "(sem nome)"} <span style="font-weight:400; color:var(--secondary); font-size:0.8rem;">· ${q.number}</span></h4><p>📅 ${new Date(q.date).toLocaleDateString('pt-BR')} | 💰 R$ ${q.total.toFixed(2)}</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;">
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="approveQuote('${q.id}')">✅ Aprovar</button>
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="enviarOrcamento('${q.id}')">📤 Enviar PDF</button>
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="editQuote('${q.id}')">✏️ Editar</button>
          <button class="btn-secondary" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="sendWhatsAppQuote('${q.id}')">💬 Avisar</button>
          <button class="btn-danger" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="cancelarOrcamento('${q.id}')">🗑️ Cancelar</button>
        </div></div>`).join("") : `<p style="text-align:center;color:var(--secondary);padding:20px;">${term ? "Nenhum orçamento encontrado para essa busca." : 'Nenhum orçamento ainda. Toque em "+ Novo Orçamento".'}</p>`;
    }

    function renderOrders() {
      const list = document.getElementById("orders-list");
      const se = document.getElementById("order-search"); const term = se ? se.value.trim() : "";
      const orders = STATE.orders.filter(o => matchSearch(o, term));
      list.innerHTML = orders.length ? orders.map(o => `
        <div class="card"><h4>${o.client.name || "(sem nome)"} <span style="font-weight:400; color:var(--secondary); font-size:0.8rem;">· ${o.number}</span></h4><p>📦 Status: <span class="status ${o.status.toLowerCase()}">${o.status.replace("_", " ")}</span></p>
        <p>💰 Sinal: R$ ${(o.total * 0.3).toFixed(2)} | Total: R$ ${o.total.toFixed(2)}</p>
        <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;">
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','EM_FABRICACAO')">🔧 Fabricação</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','EM_ESTOQUE')">📦 Estoque</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="updateOrderStatus('${o.id}','PRONTO_RETIRADA')">✅ Pronto</button>
          <button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem;" onclick="sendWhatsAppOrder('${o.id}')">💬 Cobrar</button>
        </div></div>`).join("") : '<p style="text-align:center;color:var(--secondary);padding:20px;">Nenhum pedido ainda. Aprove um orçamento.</p>';
    }

    function renderClients() {
      const list = document.getElementById("clients-list");
      const search = document.getElementById("client-search").value.toLowerCase();
      const clients = STATE.clients;
      list.innerHTML = clients.filter(c => c.name.toLowerCase().includes(search) || c.phone.includes(search))
        .map(c => `<div class="card"><h4>${c.name}</h4><p>📱 ${c.phone}</p><button class="btn-secondary" style="width:auto; padding:5px 8px; font-size:0.75rem; margin-top:4px;" onclick="window.open('https://wa.me/'+waNumber('${c.phone}'),'_blank')">💬 WhatsApp</button></div>`).join("");
    }

    async function approveQuote(id) {
      const q = STATE.quotes.find(x => x.id === id); if (!q) return;
      q.status = "APROVADO"; await sbPatch("rp_quotes", "id", q.id, { data: q });
      const orderNum = `PED-${new Date().getFullYear()}-${String(STATE.orders.length + 1).padStart(4, "0")}`;
      const order = { id: crypto.randomUUID(), number: orderNum, quoteId: q.id, client: q.client, items: q.items, total: q.total, status: "EM_FABRICACAO", createdAt: new Date().toISOString() };
      STATE.orders.unshift(order); await sbInsert("rp_orders", { id: order.id, number: order.number, data: order });
      cacheSave(); renderQuotes(); renderOrders();
      alert(`✅ Orçamento aprovado! Pedido ${orderNum} criado.`);
    }

    async function updateOrderStatus(id, status) {
      const o = STATE.orders.find(x => x.id === id); if (!o) return;
      o.status = status; await sbPatch("rp_orders", "id", o.id, { data: o }); cacheSave(); renderOrders();
    }

    function updateFab() { document.getElementById("fab-whatsapp").href = `https://wa.me/${COMPANY.whatsapp}`; }
    // Garante o código do país (55) p/ o link wa.me funcionar. Telefone é salvo só com dígitos (sem 55).
    function waNumber(p) { let d = String(p || "").replace(/\D/g, ""); if (d.length === 10 || d.length === 11) d = "55" + d; return d; }
    function sendWhatsAppQuote(id) {
      const q = STATE.quotes.find(x => x.id === id); if (!q) return;
      const tel = waNumber(q.client.phone); if (!tel) { alert("Cliente sem telefone válido cadastrado."); return; }
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(`Olá ${q.client.name}! 😊 Aqui é a Casa RP Resistências. Tudo bem? Passando pra saber se ficou alguma dúvida sobre o orçamento ${q.number} (R$ ${q.total.toFixed(2)}, válido por 15 dias). Estou à disposição! 🔧`)}`, "_blank");
    }
    function sendWhatsAppOrder(id) {
      const o = STATE.orders.find(x => x.id === id); if (!o) return;
      const tel = waNumber(o.client.phone); if (!tel) { alert("Cliente sem telefone válido cadastrado."); return; }
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(`Olá ${o.client.name}! Seu pedido ${o.number} está: ${o.status.replace("_"," ")}. ${o.status==="PRONTO_RETIRADA"?"Já pode retirar!":"Avisaremos quando pronto."} 💡`)}`, "_blank");
    }

    async function preencherIA(btn) {
      const texto = document.getElementById("ia-input").value.trim();
      if (!texto) { alert("Descreva o pedido para a IA."); return; }
      const old = btn.textContent; btn.disabled = true; btn.textContent = "✨ Gerando...";
      try {
        const r = await fetch("/api/ia", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto }) });
        const d = await r.json();
        if (!r.ok) { alert(d.error || "IA indisponível nesta versão."); }
        else {
          if (d.cliente) { if (d.cliente.nome) document.getElementById("q-client-name").value = d.cliente.nome; if (d.cliente.telefone) document.getElementById("q-client-phone").value = d.cliente.telefone; }
          const cont = document.getElementById("q-items");
          if (d.itens && d.itens.length) {
            cont.innerHTML = "";
            d.itens.forEach(it => { const row = document.createElement("div"); row.className = "item-row"; row.innerHTML = `<input type="text" class="i-desc" value="${String(it.desc || "").replace(/"/g, "&quot;")}" required><input type="number" class="i-qty" min="1" value="${it.qty || 1}" required><input type="number" class="i-price" step="0.01" value="${it.price || ""}" placeholder="R$ Un" required>`; cont.appendChild(row); });
          } else { alert("A IA não encontrou itens. Tente detalhar mais."); }
        }
      } catch (e) { alert("IA indisponível nesta versão (hospede no Railway para usar a IA)."); }
      btn.disabled = false; btn.textContent = old;
    }

    function renderCobrancas() {
      const list = document.getElementById("cobr-list");
      const pend = STATE.quotes.filter(q => q.status !== "APROVADO").slice().sort((a, b) => new Date(a.date) - new Date(b.date));
      if (!pend.length) { list.innerHTML = '<p style="text-align:center; color:var(--secondary); padding:20px;">Nenhum orçamento pendente. 🎉</p>'; return; }
      list.innerHTML = pend.map(q => {
        const dias = Math.floor((Date.now() - new Date(q.date).getTime()) / 86400000);
        const venc = dias >= 15, aten = dias >= 7;
        const cor = venc ? "var(--danger)" : aten ? "#B8860B" : "var(--success)";
        const tag = venc ? "⚠️ vencido" : aten ? "⏰ cobrar" : "novo";
        return `<div class="card" style="border-left-color:${cor}"><h4>${q.client.name || "(sem nome)"} <span style="font-weight:400; color:var(--secondary); font-size:0.8rem;">· ${q.number}</span></h4>
          <p>📅 ${dias} dia(s) · 💰 R$ ${q.total.toFixed(2)} · ${tag}</p>
          <button class="btn-success" style="width:auto; padding:6px 10px; font-size:0.8rem;" onclick="sendWhatsAppQuote('${q.id}')">💬 Cobrar no WhatsApp</button></div>`;
      }).join("");
    }

    function buildPDF(q) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const W = 210, M = 12, R = W - M, navy = [27, 58, 107];
      // ---- LOGO (badge CASA RP em vetor) ----
      const lx = M + 12, ly = 20;
      doc.setDrawColor(...navy); doc.setLineWidth(1.1); doc.circle(lx, ly, 11, "S");
      doc.setLineWidth(0.4); doc.circle(lx, ly, 8.6, "S");
      doc.setTextColor(...navy);
      doc.setFont("helvetica", "bold").setFontSize(7).text("CASA", lx, ly - 1.5, { align: "center" });
      doc.setFontSize(11).text("RP", lx, ly + 3.5, { align: "center" });
      doc.setFontSize(4).text("RESISTÊNCIAS", lx, ly + 7, { align: "center" });
      // ---- Cabeçalho ----
      const hx = lx + 16;
      doc.setFont("helvetica", "bolditalic").setFontSize(11).setTextColor(40, 40, 40).text("A Casa da Resistência Elétrica para Calor", hx, ly - 6);
      doc.setFont("helvetica", "bold").setFontSize(13).setTextColor(...navy).text("RESISTÊNCIAS ELÉTRICAS", hx, ly);
      doc.setFont("helvetica", "normal").setFontSize(6.3).setTextColor(70, 70, 70);
      doc.text("Especializada em resistências elétricas, fios e cabos especiais para calor —", hx, ly + 4.5);
      doc.text("uso doméstico, comercial, industrial, naval e hospitalar.", hx, ly + 7.5);
      let y = 38;
      doc.setDrawColor(...navy).setLineWidth(0.5).line(M, y - 4, R, y - 4);
      doc.setFont("helvetica", "bold").setFontSize(12).setTextColor(...navy).text(`ORÇAMENTO ${q.number}`, M, y);
      doc.setFontSize(8.5).text(`${new Date(q.date || Date.now()).toLocaleDateString("pt-BR")}  -  PROPOSTA VÁLIDA POR 15 DIAS`, R, y, { align: "right" });
      y += 4;
      // ---- Caixas dados empresa ----
      const box = (t) => { doc.setDrawColor(170, 170, 170).setLineWidth(0.3).rect(M, y, R - M, 7); doc.setFont("helvetica", "bold").setFontSize(8.3).setTextColor(30, 30, 30).text(t, M + 2, y + 4.6); y += 7.6; };
      box(`${COMPANY.razao}      CNPJ: ${COMPANY.cnpj}   -   IE: ${COMPANY.ie}`);
      box(`END: ${COMPANY.address}`);
      box(`TEL: ${COMPANY.phone}      WHATS: (21) 96598-7979`);
      y += 3;
      doc.setFont("helvetica", "bold").setFontSize(9).setTextColor(...navy).text("CLIENTE:", M, y);
      doc.setFont("helvetica", "normal").setTextColor(30, 30, 30).text(`${q.client.name}   -   ${q.client.phone}`, M + 20, y);
      y += 5;
      // ---- Tabela de itens ----
      const cProd = M + 14, cUn = R - 54, prodW = cUn - cProd - 3;
      doc.setFillColor(...navy).rect(M, y, R - M, 7, "F");
      doc.setFont("helvetica", "bold").setFontSize(8.5).setTextColor(255, 255, 255);
      doc.text("Qtd.", M + 2, y + 4.6);
      doc.text("Produto", cProd + 2, y + 4.6);
      doc.text("R$ un", cUn + 22, y + 4.6, { align: "right" });
      doc.text("Total", R - 2, y + 4.6, { align: "right" });
      y += 7;
      (q.items || []).forEach(it => {
        const lines = doc.setFont("helvetica", "normal").setFontSize(8).splitTextToSize(it.desc, prodW);
        const rowH = Math.max(8, lines.length * 3.7 + 3.5);
        doc.setDrawColor(205, 205, 205).setLineWidth(0.2).rect(M, y, R - M, rowH);
        doc.setTextColor(30, 30, 30);
        doc.setFont("helvetica", "bold").setFontSize(8.5).text(String(it.qty), M + 2, y + 5);
        doc.setFont("helvetica", "normal").setFontSize(8).text(lines, cProd + 2, y + 4.5);
        doc.text(`R$ ${it.price.toFixed(2)}`, cUn + 22, y + 5, { align: "right" });
        doc.setFont("helvetica", "bold").text(`R$ ${it.total.toFixed(2)}`, R - 2, y + 5, { align: "right" });
        y += rowH;
      });
      doc.setFillColor(232, 232, 232).rect(M, y, R - M, 8, "F").setDrawColor(205, 205, 205).rect(M, y, R - M, 8);
      doc.setFont("helvetica", "bold").setFontSize(10).setTextColor(30, 30, 30).text("TOTAL", cUn - 4, y + 5.4);
      doc.text(`R$ ${q.total.toFixed(2)}`, R - 2, y + 5.4, { align: "right" });
      y += 13;
      doc.setFont("helvetica", "bold").setFontSize(8.5).setTextColor(...navy);
      doc.text("CONFORME SOLICITAÇÃO, O MATERIAL SERÁ FABRICADO COM PRAZO MÍNIMO DE 12 A 20 DIAS ÚTEIS", W / 2, y, { align: "center" });
      y += 7;
      doc.setTextColor(30, 30, 30);
      const c1 = [`FATURAMENTO MÍNIMO PARA EMISSÃO DE NF: R$ ${COMPANY.minNF.toFixed(2)}`, `CÓDIGO NCM: ${COMPANY.ncm}`, "FABRICANTE: CASA RP RESISTÊNCIAS", "O PRODUTO É 100% NOVO? SIM, FABRICADO", "ALÍQUOTA DE IPI: SEM INFORMAÇÃO   -   ALÍQUOTA DE ICMS: OPERAÇÃO 500", "CONDIÇÃO DE ENTREGA: (FRETE) RETIRADA NA LOJA"];
      let h1 = c1.length * 4 + 3; doc.setDrawColor(170, 170, 170).rect(M, y, R - M, h1);
      doc.setFont("helvetica", "normal").setFontSize(7.5); let yy = y + 4; c1.forEach(t => { doc.text("-  " + t, M + 2, yy); yy += 4; });
      y += h1 + 5;
      doc.setFont("helvetica", "bold").setFontSize(9).setTextColor(...navy).text("EM CASO DE FABRICAÇÃO", W / 2, y, { align: "center" }); y += 3.5;
      const c2 = ["PRAZO DE FABRICAÇÃO: 12 A 20 DIAS ÚTEIS", "SINAL DE FABRICAÇÃO: 30% DO VALOR TOTAL", "CONFORME AMOSTRA FÍSICA OU DESENHO DETALHADO", "PODENDO TER ALTERAÇÃO NO PREÇO"];
      let h2 = c2.length * 4 + 3; doc.setTextColor(30, 30, 30).setDrawColor(170, 170, 170).rect(M, y, R - M, h2);
      doc.setFont("helvetica", "normal").setFontSize(7.5); yy = y + 4; c2.forEach(t => { doc.text("-  " + t, M + 2, yy); yy += 4; });
      y += h2 + 6;
      doc.setFont("helvetica", "bold").setFontSize(8).setTextColor(...navy).text("PAGAMENTO: Visa - Master - Amex - Diners - Elo - Boleto - Pix - em até 6x sem juros", W / 2, y, { align: "center" });
      if (q.photo) { try { doc.addImage(q.photo, "JPEG", M, y + 4, 38, 28); } catch (e) {} }
      doc.setFont("helvetica", "normal").setFontSize(6.8).setTextColor(95, 95, 95).text(`${COMPANY.razao} - CNPJ ${COMPANY.cnpj} - ${COMPANY.address}`, W / 2, 291, { align: "center" });
      return doc;
    }

    // Nome do arquivo com o nome do cliente na frente, pra achar fácil depois.
    function pdfFilename(q) {
      const nm = String((q.client && q.client.name) || "").replace(/[\\/:*?"<>|]+/g, "").trim();
      return (nm ? `${nm} - ${q.number}` : q.number) + ".pdf";
    }
    function generatePDF(q) { buildPDF(q).save(pdfFilename(q)); }

    // Envia o orçamento (PDF) pro cliente. No celular abre a folha de compartilhar -> WhatsApp anexa o PDF.
    async function enviarOrcamento(id) {
      const q = STATE.quotes.find(x => x.id === id); if (!q) return;
      const tel = waNumber(q.client.phone);
      const msg = `Olá ${q.client.name}! 😊\nAqui é a *Casa RP Resistências*.\n\nSegue o seu orçamento *${q.number}* — total *R$ ${q.total.toFixed(2)}*. O PDF com todos os itens e condições está em anexo. 📄\n\n*Condições:*\n• Validade da proposta: 15 dias\n• Prazo de fabricação: 12 a 20 dias úteis\n• Sinal de 30% para iniciar a fabricação\n• Pagamento: Pix, boleto ou cartão em até 6x\n\nQualquer dúvida, estou à disposição! 🔧`;
      const fname = pdfFilename(q);
      const doc = buildPDF(q);
      try {
        const file = new File([doc.output("blob")], fname, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: `Orçamento ${q.number}`, text: msg });
          return;
        }
      } catch (e) { if (e && e.name === "AbortError") return; }
      // Fallback (navegador sem compartilhar arquivo): baixa o PDF e abre o WhatsApp com o texto.
      doc.save(fname);
      if (tel) window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg + "\n\n(PDF baixado neste aparelho — anexe na conversa.)")}`, "_blank");
      else alert("PDF baixado. Cadastre um telefone válido do cliente para abrir o WhatsApp.");
    }

    // PWA: service worker para funcionar offline e instalar na tela inicial
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
